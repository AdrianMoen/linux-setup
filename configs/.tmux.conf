set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10 # should fix nvim mode swtich lag
# set -s copy-command 'clip.exe' # Might be wise to remove this if linux native machine.
set -g mode-keys vi

# Chooses clipboard export dynamically based on environment
run-shell '
if command -v clip.exe >/dev/null 2>&1; then
    tmux set-option -s copy-command "clip.exe"
elif [ "$XDG_SESSION_TYPE" = "wayland" ] && command -v wl-copy >/dev/null 2>&1; then
    tmux set-option -s copy-command "wl-copy"
elif command -v xclip >/dev/null 2>&1; then
    tmux set-option -s copy-command "xclip -selection clipboard"
else
    tmux set-option -s copy-command ""
fi
'

#unbind C-b
#set -g prefix C-a
#bind C-a send-prefix
set -g prefix C-b
bind C-b send-prefix

set -g pane-border-status top

set -g pane-border-format " [ ###P #T ] "

# More efficient pane switching
# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# easy reload of tmux conf file. 
bind r source-file ~/.tmux.conf

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'



bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
